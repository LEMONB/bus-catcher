name: Dev Pipeline

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint && npm run format:check

      - name: Type check
        run: npm run typecheck && npm run typecheck:server

      - name: Run unit tests
        run: npm test

      - name: Run server tests
        run: npm run test:server

  create-dev-images:
    runs-on: ubuntu-latest
    environment: Development
    needs: build-and-test
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.component }} dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.component }}
          push: true
          tags: quietjbs/sha256:buscatcher-${{ matrix.component }}-dev
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
