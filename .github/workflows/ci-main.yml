name: Prod Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  save-prev-images:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Docker Hub
        run: crane auth login docker.io -u "${{ vars.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"

      - name: Check if latest API image exists
        id: check-api
        continue-on-error: true
        run: crane digest quietjbs/sha256:buscatcher-latest > /dev/null 2>&1

      - name: Copy latest API as prev
        if: steps.check-api.outcome == 'success'
        run: crane copy quietjbs/sha256:buscatcher-latest quietjbs/sha256:buscatcher-prev

      - name: Check if latest nginx image exists
        id: check-nginx
        continue-on-error: true
        run: crane digest quietjbs/sha256:buscatcher-latest-nginx > /dev/null 2>&1

      - name: Copy latest nginx as prev
        if: steps.check-nginx.outcome == 'success'
        run: crane copy quietjbs/sha256:buscatcher-latest-nginx quietjbs/sha256:buscatcher-prev-nginx

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: save-prev-images
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push API image
        run: docker build --target api -t quietjbs/sha256:buscatcher-latest -f docker/Dockerfile .

      - name: Push API image
        run: docker push quietjbs/sha256:buscatcher-latest

      - name: Build and push nginx image
        run: docker build -t quietjbs/sha256:buscatcher-latest-nginx -f docker/Dockerfile .

      - name: Push nginx image
        run: docker push quietjbs/sha256:buscatcher-latest-nginx

  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: build-and-push-images
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Copy deployment files to production
        run: scp -o StrictHostKeyChecking=no -p ./docker-compose.prod.yml ./deploy.sh root@${{ secrets.VPS_HOST }}:/root/buscatcher/

      - name: Deploy on production server
        run: ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "cd /root/buscatcher; chmod +x deploy.sh; ./deploy.sh"
