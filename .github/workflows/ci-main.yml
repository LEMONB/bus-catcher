name: Prod Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  save-prev-images:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Docker Hub
        run: crane auth login docker.io -u "${{ vars.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"

      - name: Check if backend latest exists
        id: check-backend
        continue-on-error: true
        run: crane digest quietjbs/sha256:buscatcher-backend-latest > /dev/null 2>&1

      - name: Copy backend latest as prev
        if: steps.check-backend.outcome == 'success'
        run: crane copy quietjbs/sha256:buscatcher-backend-latest quietjbs/sha256:buscatcher-backend-prev

      - name: Check if frontend latest exists
        id: check-frontend
        continue-on-error: true
        run: crane digest quietjbs/sha256:buscatcher-frontend-latest > /dev/null 2>&1

      - name: Copy frontend latest as prev
        if: steps.check-frontend.outcome == 'success'
        run: crane copy quietjbs/sha256:buscatcher-frontend-latest quietjbs/sha256:buscatcher-frontend-prev

  promote-to-latest:
    runs-on: ubuntu-latest
    environment: Production
    needs: save-prev-images
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Docker Hub
        run: crane auth login docker.io -u "${{ vars.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"

      - name: Promote backend dev to latest
        run: crane copy quietjbs/sha256:buscatcher-backend-dev quietjbs/sha256:buscatcher-backend-latest

      - name: Promote frontend dev to latest
        run: crane copy quietjbs/sha256:buscatcher-frontend-dev quietjbs/sha256:buscatcher-frontend-latest

  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: promote-to-latest
    steps:
      - uses: actions/checkout@v5

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Copy deployment files to production
        run: scp -o StrictHostKeyChecking=no -p ./docker-compose.prod.yml ./deploy.sh root@${{ secrets.VPS_HOST }}:/root/buscatcher/

      - name: Deploy on production server
        run: ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "cd /root/buscatcher; chmod +x deploy.sh; ./deploy.sh"
