services:
  backend:
    image: quietjbs/sha256:buscatcher-backend-latest
    container_name: buscatcher-api
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - ADMIN_TOKEN=${ADMIN_TOKEN:-buscatcher-admin}
    volumes:
      - gtfs-data:/app/data
    networks:
      - buscatcher-network

  frontend:
    image: quietjbs/sha256:buscatcher-frontend-latest
    container_name: buscatcher-nginx
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - buscatcher-network

networks:
  buscatcher-network:
    name: buscatcher-network

volumes:
  gtfs-data:
