services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend
    container_name: buscatcher-api
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - ADMIN_TOKEN=${ADMIN_TOKEN:-buscatcher-admin}
      - BUSMAPS_API_KEY=${BUSMAPS_API_KEY}
    volumes:
      - gtfs-data:/app/data
    networks:
      - buscatcher-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
    container_name: buscatcher-nginx
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - buscatcher-network

networks:
  buscatcher-network:
    name: buscatcher-network

volumes:
  gtfs-data:
