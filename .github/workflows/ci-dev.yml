name: Dev Pipeline

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, format, typecheck
        run: npm run check

      - name: Run unit tests
        run: npm test

  create-dev-images:
    runs-on: ubuntu-latest
    environment: Development
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build backend dev image
        run: docker build --target backend -t quietjbs/sha256:buscatcher-backend-dev -f docker/Dockerfile .

      - name: Build frontend dev image
        run: docker build --target frontend -t quietjbs/sha256:buscatcher-frontend-dev -f docker/Dockerfile .

      - name: Push backend dev image
        run: docker push quietjbs/sha256:buscatcher-backend-dev

      - name: Push frontend dev image
        run: docker push quietjbs/sha256:buscatcher-frontend-dev
