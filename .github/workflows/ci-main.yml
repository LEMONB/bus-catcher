name: Prod Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  save-prev-image:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Docker Hub
        run: crane auth login docker.io -u "${{ vars.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"

      - name: Check if latest image exists
        id: check-latest
        continue-on-error: true
        run: crane digest quietjbs/sha256:buscatcher-latest > /dev/null 2>&1

      - name: Copy latest as prev
        if: steps.check-latest.outcome == 'success'
        run: crane copy quietjbs/sha256:buscatcher-latest quietjbs/sha256:buscatcher-prev

  promote-to-latest:
    runs-on: ubuntu-latest
    environment: Production
    needs: save-prev-image
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Docker Hub
        run: crane auth login docker.io -u "${{ vars.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"

      - name: Promote dev to latest
        run: crane copy quietjbs/sha256:buscatcher-dev quietjbs/sha256:buscatcher-latest

  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: promote-to-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Copy deployment files to production
        run: scp -o StrictHostKeyChecking=no -p ./docker-compose.yml ./deploy.sh root@${{ secrets.VPS_HOST }}:/root/buscatcher/

      - name: Deploy on production server
        run: ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "cd /root/buscatcher; chmod +x deploy.sh; ./deploy.sh"
